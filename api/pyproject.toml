[project]
name = "financas"
version = "0.1.0"
description = "API de finanças pessoais: importa extratos e categoriza gastos com regras e IA (Claude)."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "financas.main:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "S", "PTH", "RET", "RUF", "PL"]
ignore = ["PLR2004"]  # magic numbers read fine in tests and small parsers

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR0913"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["financas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["financas"]
